[project]
name = "sgnl-workers"
version = "0.1.0"
description = "Signal Machine Python workers"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "structlog>=24.4",
  "python-dotenv>=1.0",
  "openai>=1.50",
  "playwright>=1.48",
  "apify-client>=1.8",
  "httpx>=0.27",
]

[tool.uv.workspace]
members = []

[tool.setuptools.packages.find]
include = ["shared*", "detection*", "scoring*", "routing*", "apify*", "playwright_worker*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
